name: Verify CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        run: npm i -g pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Run full‑verify
        run: node scripts/full-verify.mjs
      - name: Run tests
        run: pnpm test
      - name: Smoke unified-orchestrator (dry-run)
        run: node scripts/unified-orchestrator.mjs
        env:
          GH_TOKEN: ${{ github.token }}
