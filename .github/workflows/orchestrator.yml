name: Orchestrator
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: unified-orchestrator
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        run: npm i -g pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Run unified orchestrator
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_PAT }}
          EXECUTE: ${{ vars.ORCHESTRATOR_EXECUTE }}
        run: |
          ARGS=""
          if [ "$EXECUTE" = "true" ]; then ARGS="--execute"; fi
          node scripts/unified-orchestrator.mjs $ARGS