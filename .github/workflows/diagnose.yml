name: Diagnose
on:
  workflow_dispatch: {}
  push:
    branches: [pr28-clean]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run test-breaker-persist only
        run: |
          node --report-on-fatalerror --report-directory=$RUNNER_TEMP scripts/test-breaker-persist.mjs; echo "exit=$?"
          ls -la "$RUNNER_TEMP" 2>/dev/null | head -20 || true
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-report
          path: ${{ runner.temp }}/*.json
          if-no-files-found: ignore
